# Copy this file into your repository verbatim, as
# `.github/workflows/greenlight-review.yml`.
#
# Greenlight invokes it to AI review PRs when configured to do so.
# Setup: README.md in dourolabs/greenlight-actions.

name: greenlight AI review

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: The sha under review.
        required: true
        type: string
      pr_number:
        description: PR number, decimal string.
        required: true
        type: string
      base_ref:
        description: The PR base branch.
        required: true
        type: string
      review_name:
        description: The key from the repo config's `reviews` map.
        required: true
        type: string
      prompt_path:
        description: Repo-relative path to the prompt file.
        required: true
        type: string
      check_name:
        description: The check-run name to post against `head_sha`.
        required: true
        type: string
      verdict_url:
        description: Where the report job sends the verdict.
        required: false
        type: string

jobs:
  review:
    # Do not edit: these permissions are required for the workflow to
    # post its result.
    permissions:
      contents: read
      checks: write
      id-token: write
    uses: dourolabs/greenlight-actions/.github/workflows/greenlight-review-impl.yml@v2
    with:
      head_sha: ${{ inputs.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      base_ref: ${{ inputs.base_ref }}
      review_name: ${{ inputs.review_name }}
      prompt_path: ${{ inputs.prompt_path }}
      check_name: ${{ inputs.check_name }}
      verdict_url: ${{ inputs.verdict_url }}
    # Named, not `inherit`: `inherit` does not cross org boundaries.
    # Pass all six; an unset one passes as empty. Set the API key or one
    # or more OAuth slots, not both.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
      CLAUDE_CODE_OAUTH_TOKEN_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
      CLAUDE_CODE_OAUTH_TOKEN_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_4 }}
      CLAUDE_CODE_OAUTH_TOKEN_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_5 }}
