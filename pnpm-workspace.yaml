overrides:
  "@solana/web3.js@1.77.4>rpc-websockets": 7.11.0
  # Security fixes for transitive dependencies. Each selector matches only the
  # vulnerable range inside one major version, so a package never moves to a
  # new major. They are needed because parents pin exact vulnerable versions:
  # for example `fuels` pins handlebars 4.7.8, `express` pins body-parser
  # 1.20.3, and `@ethersproject/signing-key` pins elliptic 6.5.4. Remove an
  # override once its parent ships a fixed version.
  "@babel/plugin-transform-modules-systemjs@>=7 <7.29.4": ^7.29.4
  "@cprussin/jest-config>next@>=15 <15.5.28": ^15.5.28
  "@grpc/grpc-js@>=1 <1.13.6": ^1.13.6
