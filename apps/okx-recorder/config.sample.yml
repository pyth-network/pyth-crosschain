# OKX perpetual-swap instruments to subscribe on the single multiplexed public
# websocket connection. Instruments are config-driven only: adding an OKX perp
# is a config change, no code change. Stored/subscribed upper-cased (OKX
# instrument ids are upper-case).
#
# NOTE: OKX rejects a subscribe for an instrument that doesn't exist with an
# error event; the recorder logs it and the instrument shows up as perpetual
# staleness in /ready rather than a crash. Verify each instrument is actually
# listed on OKX before relying on its data.
instruments:
  - "OPENAI-USDT-SWAP"
  - "ANTHROPIC-USDT-SWAP"

ws_url: "wss://ws.okx.com:8443/ws/v5/public"

clickhouse:
  url: "http://clickhouse-local:8123"
  user: "recorder"
  password: "recorder"
  database: "default"
  book_ticker_table: "okx_book_ticker"
  funding_rates_table: "okx_funding_rates"

metrics_port: 9095
health_port: 8085
ready_stale_seconds: 10
queue_max_rows: 50000
batch_max_rows: 10000
batch_flush_seconds: 2.0
reconnect_max_backoff_seconds: 30
insert_async: true

# Funding lane: REST poller for the SETTLED funding rate (funding-rate-history
# endpoint, not the websocket predicted-rate stream). Each poll re-fetches the
# last `funding_history_limit` events per instrument (OKX caps limit at 100);
# the overlap is harmless because inserts are idempotent by
# (inst_id, funding_time). Funding staleness never gates /ready.
funding_history_url: "https://www.okx.com/api/v5/public/funding-rate-history"
funding_poll_seconds: 300
funding_history_limit: 10
